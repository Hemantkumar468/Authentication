<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner Card</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="planner-card">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div class="brand-icon" aria-hidden="true">🗺️</div>
          <span class="advanced-pill">ADVANCED</span>
        </div>

        <h1 class="planner-title">Travel Planner</h1>
        <p class="planner-description mb-0">
          Trip plan karo, maps pe pins daalo, budget track karo, itinerary banao.
          Mapbox aur weather API se supercharge karo.
        </p>

        <div class="tag-row">
          <span class="feature-tag">api</span>
          <span class="feature-tag">maps</span>
          <span class="feature-tag">localstorage</span>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
